<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Cubed</title>
    <!-- iOS: lets "Add to Home Screen" launch with no Safari chrome (address bar, tab bar) at all. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cubed">
    <meta name="theme-color" content="#1b163a">
    <!-- Every device: the game fills the whole screen (no zoom, under the notch with safe-area insets handled in game). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, minimal-ui">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="rotate-overlay" style="display:none;position:fixed;inset:0;z-index:1000;background:#1b163a;color:#fff;font-family:sans-serif;text-align:center;flex-direction:column;align-items:center;justify-content:center;">
        <div style="width:56px;height:96px;border:5px solid #ffd45a;border-radius:12px;margin-bottom:28px;animation:cubed-rotate 1.6s ease-in-out infinite;"></div>
        <div style="font-size:24px;font-weight:bold;">Rotate your phone</div>
        <div style="font-size:16px;opacity:0.8;margin-top:8px;">Cubed is played sideways</div>
      </div>
      <div id="cubed-resume" style="display:none;position:fixed;inset:0;z-index:1001;background:#1b163a;color:#fff;font-family:sans-serif;text-align:center;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;">
        <div style="font-size:30px;font-weight:bold;margin-bottom:12px;">Cubed</div>
        <div id="cubed-resume-text" style="font-size:22px;padding:14px 28px;border-radius:14px;background:#ffd45a;color:#1b163a;font-weight:bold;">Tap to continue</div>
        <div id="cubed-resume-sub" style="font-size:14px;margin-top:14px;opacity:0.8;">Your progress is saved.</div>
      </div>
      <style>@keyframes cubed-rotate { 0%,20% { transform: rotate(0deg); } 60%,100% { transform: rotate(-90deg); } }</style>
      <div id="unity-warning"> </div>
      <div id="cubed-fs-button" title="Full screen"></div>
      <div id="cubed-ios-hint"><span id="cubed-ios-hint-text"></span><button id="cubed-ios-hint-ok">OK</button></div>
      <!-- Kept hidden: development builds hang their profiler buttons on the build title. -->
      <div id="unity-footer" style="display:none">
        <div id="unity-build-title">Cubed</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Aldratos_Cube_Survival_WebTest.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Aldratos_Cube_Survival_WebTest.data.unityweb",
        frameworkUrl: buildUrl + "/Aldratos_Cube_Survival_WebTest.framework.js.unityweb",
        codeUrl: buildUrl + "/Aldratos_Cube_Survival_WebTest.wasm.unityweb",
        symbolsUrl: buildUrl + "/Aldratos_Cube_Survival_WebTest.symbols.json.unityweb",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "Alexandre Rosenfeld",
        productName: "Cubed",
        productVersion: "0.9.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      // Device class. iPadOS Safari reports a Mac desktop user agent, so touch is detected from the hardware (maxTouchPoints /
      // coarse pointer), not only from the user agent.
      const ua = navigator.userAgent || "";
      const touch = (navigator.maxTouchPoints || 0) > 1 || window.matchMedia("(pointer: coarse)").matches || /iPhone|iPad|iPod|Android/i.test(ua);
      const iOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1);
      const shortSide = Math.min(screen.width || window.innerWidth, screen.height || window.innerHeight);
      const tablet = touch && shortSide >= 600;
      const standalone = window.matchMedia("(display-mode: fullscreen)").matches || window.matchMedia("(display-mode: standalone)").matches
        || window.navigator.standalone === true;
      window.cubedDevice = { touch: touch, iOS: iOS, tablet: tablet, standalone: standalone };
      document.querySelector("#unity-container").className = touch ? "unity-mobile" : "unity-desktop";
      canvas.className = touch ? "unity-mobile" : "unity-desktop";

      // Performance: the canvas is drawn at a capped pixel ratio. Phones report 3x (an iPhone would be ~3 million pixels a frame);
      // tablets have big screens, so they get less (1.5x); 2x on phones and desktops is visually the same at play distance.
      // The game can lower its own render scale further when the frame rate drops (AdaptiveResolution).
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, tablet ? 1.5 : 2);

      // Real fullscreen where the browser allows it (Android, desktop): the first tap/click asks for it (and on phones locks the
      // screen sideways); a small corner button toggles it. iOS/iPadOS Safari cannot fullscreen a page: "Add to Home Screen"
      // starts the game from the icon with no browser bars (manifest + apple-mobile-web-app-capable), and a one-time hint says so.
      const root = document.documentElement;
      const fsRequest = root.requestFullscreen || root.webkitRequestFullscreen;
      const fsExit = document.exitFullscreen || document.webkitExitFullscreen;
      const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
      const canFullscreen = !!fsRequest && !iOS && !standalone;
      const lockLandscape = () => {
        try {
          if (touch && screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(() => { });
          }
        } catch (e) { }
      };
      const enterFullscreen = () => {
        if (!canFullscreen || fsElement()) {
          return;
        }
        try {
          Promise.resolve(fsRequest.call(root, { navigationUI: "hide" })).then(lockLandscape).catch(() => { });
        } catch (e) { }
      };
      const fsButton = document.querySelector("#cubed-fs-button");
      let fadeTimer = 0;
      const showFsButton = () => {
        if (!canFullscreen || fsElement()) {
          fsButton.style.display = "none";
          return;
        }
        fsButton.style.display = "block";
        fsButton.classList.remove("faded");
        clearTimeout(fadeTimer);
        fadeTimer = setTimeout(() => fsButton.classList.add("faded"), 4000);
      };
      fsButton.addEventListener("click", (e) => { e.stopPropagation(); fsElement() ? (fsExit && fsExit.call(document)) : enterFullscreen(); });
      document.addEventListener("fullscreenchange", showFsButton);
      document.addEventListener("webkitfullscreenchange", showFsButton);
      if (!touch) {
        window.addEventListener("mousemove", showFsButton, { passive: true });
      }
      if (canFullscreen) {
        // Touch devices go fullscreen on the first tap; desktops on the first click (browsers only allow it from a user gesture).
        document.addEventListener("pointerup", enterFullscreen, { once: true });
        showFsButton();
      }

      // iOS / iPadOS in Safari (not already launched from the home screen): a friendly one-time hint.
      if (iOS && !standalone) {
        let hinted = false;
        try { hinted = localStorage.getItem("cubed.a2hsHint") === "1"; } catch (e) { }
        if (!hinted) {
          const langHint = (navigator.language || "en").toLowerCase();
          const hintText = langHint.startsWith("pt") ? "Para tela cheia: toque em <b>Compartilhar</b> e em <b>Adicionar à Tela de Início</b>."
            : langHint.startsWith("es") ? "Para pantalla completa: toca <b>Compartir</b> y <b>Añadir a pantalla de inicio</b>."
            : "For full screen: tap <b>Share</b>, then <b>Add to Home Screen</b>.";
          const hint = document.querySelector("#cubed-ios-hint");
          document.querySelector("#cubed-ios-hint-text").innerHTML = hintText;
          const closeHint = () => {
            hint.style.display = "none";
            try { localStorage.setItem("cubed.a2hsHint", "1"); } catch (e) { }
          };
          document.querySelector("#cubed-ios-hint-ok").addEventListener("click", (e) => { e.stopPropagation(); closeHint(); });
          setTimeout(() => { hint.style.display = "flex"; }, 1500);
          setTimeout(() => { hint.style.display = "none"; }, 20000); // hides itself, but comes back next visit until OK is tapped
        }
      }

      if (touch) {
        // Landscape only: devices held upright see a "Rotate your phone" card (the run pauses behind it).
        const rotateOverlay = document.querySelector("#rotate-overlay");
        const portrait = window.matchMedia("(orientation: portrait)");
        const showRotate = () => {
          const upright = portrait.matches;
          rotateOverlay.style.display = upright ? "flex" : "none";
          if (upright && window.cubedInstance) {
            try { window.cubedInstance.SendMessage("GameManager", "Pause"); } catch (e) { }
          }
        };
        portrait.addEventListener ? portrait.addEventListener("change", showRotate) : portrait.addListener(showRotate);
        window.addEventListener("resize", showRotate);
        showRotate();
        // iOS Safari: no rubber-band scrolling or pinch zoom pulling the page around under the game.
        document.addEventListener("touchmove", (e) => { if (e.touches && e.touches.length > 1) { e.preventDefault(); } }, { passive: false });
        document.addEventListener("gesturestart", (e) => e.preventDefault());
      }



      // Coming back to the tab: if the browser dropped the game's WebGL context (common on phones after switching apps) or the game
      // stopped drawing, a "Tap to continue" card reloads the page instead of leaving a frozen screen. Progress is in the save.
      const lang = (navigator.language || "en").toLowerCase();
      const words = lang.startsWith("pt") ? ["Toque para continuar", "Seu progresso está salvo.", "Não foi possível carregar. Toque para tentar de novo."]
        : lang.startsWith("es") ? ["Toca para continuar", "Tu progreso está guardado.", "No se pudo cargar. Toca para reintentar."]
        : ["Tap to continue", "Your progress is saved.", "Couldn't load the game. Tap to try again."];
      const resumeCard = document.querySelector("#cubed-resume");
      const showResume = (failed) => {
        document.querySelector("#cubed-resume-text").textContent = failed ? words[2] : words[0];
        document.querySelector("#cubed-resume-sub").textContent = failed ? "" : words[1];
        resumeCard.style.display = "flex";
        window.cubedResumeShown = failed ? "failed" : "lost";
      };
      resumeCard.addEventListener("click", () => location.reload());
      canvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); showResume(false); }, false);
      const send = (method) => { try { window.cubedInstance && window.cubedInstance.SendMessage("WebLifecycle", method); } catch (e) { } };
      const checkAlive = () => {
        if (!window.cubedInstance || resumeCard.style.display === "flex") {
          return;
        }
        let lost = false;
        try {
          const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
          lost = !gl || gl.isContextLost();
        } catch (e) { lost = true; }
        const stale = performance.now() - (window.cubedHeartbeat || 0) > 2500;
        if (lost || stale) {
          showResume(false);
        }
      };
      window.cubedCheckAlive = checkAlive;
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          send("OnHidden");
        } else {
          send("OnVisible");
          setTimeout(checkAlive, 3000);
        }
      });
      window.addEventListener("pagehide", () => send("OnHidden"));
      window.addEventListener("pageshow", (e) => { if (e.persisted) { setTimeout(checkAlive, 3000); } });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = () => showResume(true);
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        // A big data file comes in parts (GitHub refuses files over 100 MB; see WebTestBuild.SplitDataFile): download them
        // (the first half of the bar), join them and give Unity the whole file. Without data-parts.json the file is loaded as is.
        const loadData = () => fetch(buildUrl + "/data-parts.json", { cache: "no-store" })
          .then((response) => response.ok ? response.json() : null)
          .catch(() => null)
          .then((manifest) => {
            if (!manifest) {
              return 0;
            }
            loadingContainer.style.display = "block";
            const received = new Array(manifest.parts).fill(0);
            const showProgress = () => {
              const done = received.reduce((a, b) => a + b, 0);
              progressBarFull.style.width = 50 * done / manifest.bytes + "%";
            };
            const part = (i) => fetch(buildUrl + "/" + manifest.file + ".part" + i).then((response) => {
              const reader = response.body.getReader();
              const chunks = [];
              const pump = () => reader.read().then(({ done, value }) => {
                if (done) {
                  return new Blob(chunks);
                }
                chunks.push(value);
                received[i] += value.length;
                showProgress();
                return pump();
              });
              return pump();
            });
            const all = [];
            for (let i = 0; i < manifest.parts; i++) {
              all.push(part(i));
            }
            return Promise.all(all).then((blobs) => {
              config.dataUrl = URL.createObjectURL(new Blob(blobs));
              return 0.5;
            });
          });

        loadData().then((start) => createUnityInstance(canvas, config, (progress) => {
          if (window.cubedInstance) {
            return; // late progress reports (after the game is up) must not bring the loading bar back over it
          }
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * (start + (1 - start) * progress) + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        })).then((unityInstance) => {
                window.cubedInstance = unityInstance;
                loadingContainer.style.display = "none"; // never leave the loading bar (and its blur) over the game

              }).catch((message) => {
                console.error(message);
                showResume(true);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
