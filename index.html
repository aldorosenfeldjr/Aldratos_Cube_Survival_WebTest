      const lang = (navigator.language || "en").toLowerCase();

        const tips = {
          en: ["Dodge the falling crates!", "Grab power-ups for a boost", "Swipe up to jump (once you learn it)", "Crates that break on the floor pay coins", "Find the story pages in every world", "Your companion levels up as you play"],
          pt: ["Desvie das caixas que caem!", "Pegue power-ups para um empurrão", "Deslize para cima para pular (quando aprender)", "Caixas que quebram no chão dão moedas", "Ache as páginas da história em cada mundo", "Seu companheiro sobe de nível enquanto você joga"],
          es: ["¡Esquiva las cajas que caen!", "Agarra power-ups para un empujón", "Desliza hacia arriba para saltar (cuando lo aprendas)", "Las cajas que se rompen en el suelo dan monedas", "Encuentra las páginas de la historia en cada mundo", "Tu compañero sube de nivel mientras juegas"],
        }[lang] || null;
        const tipList = tips || ["Dodge the falling crates!", "Grab power-ups for a boost", "Crates that break on the floor pay coins"];
        const tipEl = document.querySelector("#cubed-tip");
        let tipIndex = Math.floor(Math.random() * tipList.length);
        const nextTip = () => {
          tipEl.classList.remove("show");
          setTimeout(() => { tipEl.textContent = tipList[tipIndex++ % tipList.length]; tipEl.classList.add("show"); }, 300);
        };
        nextTip();
        window.cubedTipTimer = setInterval(nextTip, 3500);

        // The data file comes in parts (GitHub refuses files over 100 MB; see WebTestBuild.SplitDataFile). data-parts.json names
        // two variants: the ASTC textures (phones) and "dxt" (desktop / TV GPUs, which cannot read ASTC: Unity would unpack every
        // texture in software at load). Parts are kept in the browser's Cache Storage per build stamp, so a second visit skips the
        // download; a gzip data file is unpacked by the browser's native DecompressionStream instead of Unity's JS fallback.
        // Without data-parts.json Unity loads the plain data file itself.
        const gpuReadsAstc = /[?&]astc=1/.test(location.search) || (() => { // ?astc=1: force the phone variant (testing)
          try {
            const c = document.createElement("canvas");
            const gl = c.getContext("webgl2") || c.getContext("webgl");
            return !!(gl && gl.getExtension("WEBGL_compressed_texture_astc"));
          } catch (e) { return true; }
        })();
        // On-demand content (ContentStream): the levels and story shots of each world come from Content/<astc|dxt>/, the same
        // texture variant as the data file.
        try { window.cubedContentBase = new URL("Content/" + (gpuReadsAstc ? "astc" : "dxt") + "/", location.href).href; } catch (e) {}
        const openCache = () => ("caches" in window ? caches.open("cubed-data").catch(() => null) : Promise.resolve(null));
        const loadData = () => fetch(buildUrl + "/data-parts.json", { cache: "no-store" })
          .then((response) => response.ok ? response.json() : null)
          .catch(() => null)
          .then((all) => {
            if (!all) {
              return 0;
            }
            const manifest = (!gpuReadsAstc && all.dxt) ? all.dxt : all;
            const stamp = all.stamp || "";
            loadingContainer.style.display = "block";
            // Parts from older builds lived in Cache Storage; a whole data file is cached by Unity itself, so drop that copy.
            if ("caches" in window) { caches.delete("cubed-data").catch(() => {}); }
            if (!manifest.parts) {
              // One whole file: Unity downloads, unpacks and caches it itself (no extra copies in the page = less memory on phones).
              config.dataUrl = buildUrl + "/" + manifest.file + "?v=" + stamp;
              window.cubedDataBytes = manifest.bytes;
              return 0;
            }
            const received = new Array(manifest.parts).fill(0);
            const showProgress = () => {
              const done = received.reduce((a, b) => a + b, 0);
              cubedProgress(0.8 * done / manifest.bytes, W.dl + " " + mb(done) + " / " + mb(manifest.bytes) + " MB");
            };
            return openCache().then((cache) => {
              if (cache) {
                // Drop parts of older builds so the cache never grows past one build.
                cache.keys().then((keys) => keys.forEach((k) => { if (k.url.indexOf("v=" + stamp) < 0) { cache.delete(k); } })).catch(() => {});
              }
              const part = (i) => {
                const url = buildUrl + "/" + manifest.file + ".part" + i + "?v=" + stamp;
                const download = () => fetch(url).then((response) => {
                  const reader = response.body.getReader();
                  const chunks = [];
                  const pump = () => reader.read().then(({ done, value }) => {
                    if (done) {
                      const blob = new Blob(chunks);
                      if (cache) { cache.put(url, new Response(blob)).catch(() => {}); }
                      return blob;
                    }
                    chunks.push(value);
                    received[i] += value.length;
                    showProgress();
                    return pump();
                  });
                  return pump();
                });
                if (!cache) {
                  return download();
                }
                return cache.match(url).then((hit) => hit ? hit.blob().then((blob) => { received[i] = blob.size; showProgress(); return blob; }) : download())
                  .catch(() => download());
              };
              const parts = [];
              for (let i = 0; i < manifest.parts; i++) {
                parts.push(part(i));
              }
              return Promise.all(parts);
            }).then((blobs) => {
              const joined = new Blob(blobs);
              if (all.gzip && "DecompressionStream" in window) {
                cubedStage(W.unpack, 0.8, 0.86);
                return new Response(joined.stream().pipeThrough(new DecompressionStream("gzip"))).blob()
                  .then((raw) => { clearInterval(stageTimer); stageTimer = null; config.dataUrl = URL.createObjectURL(raw); return 0.86; })
                  .catch(() => { clearInterval(stageTimer); stageTimer = null; config.dataUrl = URL.createObjectURL(joined); return 0.8; });
              }
              config.dataUrl = URL.createObjectURL(joined);
              return 0.8;
            });
          });

        loadData().then((start) => createUnityInstance(canvas, config, (progress) => {
          if (window.cubedInstance) {
            return; // late progress reports (after the game is up) must not bring the loading bar back over it
          }
          // Unity reports its own downloads up to 0.9, then sits at 0.9 while it unpacks the data and compiles the engine.
          loadingContainer.style.display = "block";
          if (progress < 0.9) {
            const f = start + (0.88 - start) * (progress / 0.9);
            if (start > 0) {
              if (!stageTimer) { cubedStage(W.unpack, f, 0.88); }
            } else if (window.cubedDataBytes) {
              const got = window.cubedDataBytes * Math.min(1, progress / 0.9);
              cubedProgress(0.85 * progress / 0.9, W.dl + " " + mb(got) + " / " + mb(window.cubedDataBytes) + " MB");
            } else {
              cubedProgress(f);
            }
          } else if (progress < 1) {
            if (!window.cubedEngineStage) { window.cubedEngineStage = true; window.cubedT = window.cubedT || {}; window.cubedT.dataDone = Math.round(performance.now()); cubedStage(W.engine, Math.max(shown, 0.88), 0.95); }
          }
        })).then((unityInstance) => {
                window.cubedInstance = unityInstance;
                window.cubedT = window.cubedT || {}; window.cubedT.engineUp = Math.round(performance.now());
                // The engine is up; the loader stays until the game's first heartbeat (the main menu is running), 8 s at most.
                cubedStage(W.world, Math.max(shown, 0.95), 0.995);
                const t0 = window.cubedHeartbeat || 0;
                const waitReady = setInterval(() => {
                  if ((window.cubedHeartbeat || 0) !== t0) { clearInterval(waitReady); window.cubedT.firstHeartbeat = Math.round(performance.now()); cubedHideLoader(); }
                }, 100);
                setTimeout(() => { clearInterval(waitReady); cubedHideLoader(); }, 8000);

              }).catch((message) => {
                console.error(message);
                showResume(true);
              });
            };

      document.body.appendChild(script);
      };
      fetch("version.json?t=" + Date.now(), { cache: "no-store" })
        .then((r) => r.ok ? r.json() : null)
        .catch(() => null)
        .then((v) => {
          const live = v && v.stamp;
          const flag = "cubed-reloaded-for-" + live;
          let reloaded = false;
          try { reloaded = sessionStorage.getItem(flag) === "1"; } catch (e) {}
          if (live && live !== "202611131249" && !reloaded) {
            try { sessionStorage.setItem(flag, "1"); } catch (e) {}
            const u = new URL(location.href);
            u.searchParams.set("b", live);
            location.replace(u.toString());
            return;
          }
          cubedStartLoader();
        });

    </script>
  </body>
</html>
